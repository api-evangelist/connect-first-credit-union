aid: connect-first-credit-union
name: connectFirst Credit Union
review:
  question: Does connectFirst Credit Union expose a first-party public developer API or developer portal?
  answer: false
  date: '2026-07-23'
  reviewer: API Evangelist
findings:
  summary: |
    connectFirst Credit Union publishes no first-party public API and no
    developer portal. It is a member-owned Alberta cooperative credit union
    (formed 2021 by amalgamating four Alberta credit unions) whose members
    approved a merger with Servus Credit Union; the legal amalgamation closed
    May 1, 2024 as "Connect First and Servus Credit Union Ltd." and the brand
    realigned to Servus Credit Union in January 2025. The connectfirstcu.com
    root now 301-redirects to servus.ca. Consistent with the honest posture of
    most Canadian credit unions, consumer data access is aggregator-based
    (Plaid coverage confirmed) rather than via a first-party data-sharing API.
    Digital banking is delivered through the Celero Xpress platform (powered by
    ebankIT) over the Central 1 / Celero cooperative banking-technology stack.
    No downloadable OpenAPI/Swagger, no OAuth2/OIDC developer authorization
    surface, and no documented FDX membership were found. Canada has no
    operational open-banking mandate — the federal Consumer-Driven Banking
    framework (Budget 2024, FCAC-overseen) is legislated but not yet live — and
    the U.S. Section 1033 rule does not apply to a Canadian institution.
