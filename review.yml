actions:
  apisYmlUpdated: true
  reason: |
    Identity-only (built-stub) record. No public API exists to catalog, so
    apis[] is empty and only verified live company links are recorded in
    common[]. Aggregator-only consumer access and the merged-into-Servus status
    are captured honestly rather than fabricating an endpoint or spec.
